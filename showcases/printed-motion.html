<!doctype html>
<om-film>
  <!-- Presentation -->
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body,
    om-film,
    om-scene,
    om-shot {
      display: block;
      height: 100%;
      margin: 0;
      overflow: hidden;
      width: 100%;
    }

    body {
      background: #ece9e1;
      color: #111;
      font-family: "Instrument Sans", sans-serif;
    }

    .print {
      background:
        repeating-linear-gradient(
          0deg,
          rgb(17 17 17 / 3%) 0,
          rgb(17 17 17 / 3%) 1px,
          transparent 1px,
          transparent 4px
        ),
        #ece9e1;
      height: 100%;
      overflow: hidden;
      position: relative;
    }

    .registration {
      border: 2px solid #111;
      border-radius: 50%;
      height: min(13vw, 210px);
      left: -8%;
      position: absolute;
      top: 15%;
      width: min(13vw, 210px);
    }

    .registration::before,
    .registration::after {
      background: #111;
      content: "";
      left: 50%;
      position: absolute;
      top: 50%;
      transform: translate(-50%, -50%);
    }

    .registration::before {
      height: 1px;
      width: 140%;
    }

    .registration::after {
      height: 140%;
      width: 1px;
    }

    .red-disc {
      background: #ef402f;
      border-radius: 50%;
      height: min(26vw, 450px);
      left: 14%;
      position: absolute;
      top: 64%;
      transform: translate(-50%, -50%);
      width: min(26vw, 450px);
    }

    .rule {
      background: #111;
      height: 5px;
      left: -10%;
      position: absolute;
      top: 50%;
      transform: rotate(-7deg);
      width: 120%;
    }

    .rule-thin {
      height: 1px;
      top: 32%;
      transform: rotate(4deg);
    }

    .phrases {
      inset: 0;
      position: absolute;
      z-index: 3;
    }

    .phrase {
      left: 7%;
      opacity: 0;
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 86%;
    }

    .phrase span {
      display: block;
      font-size: clamp(82px, 10.8vw, 208px);
      font-weight: 700;
      letter-spacing: -0.06em;
      line-height: 0.79;
      word-spacing: 0.06em;
    }

    .phrase em {
      color: #ece9e1;
      font-family: "Instrument Serif", serif;
      font-weight: 400;
      paint-order: stroke fill;
      -webkit-text-stroke: 1.5px #111;
    }

    .phrase-two,
    .phrase-four {
      text-align: right;
    }

    .folio {
      color: #ef402f;
      font-family: "Instrument Serif", serif;
      font-size: clamp(92px, 11vw, 210px);
      font-style: italic;
      position: absolute;
      right: 5%;
      top: 2%;
      z-index: 2;
    }

    .marks {
      bottom: 28px;
      display: grid;
      font-size: clamp(9px, 0.62vw, 12px);
      font-weight: 700;
      gap: 24px;
      grid-template-columns: auto 1fr auto;
      left: 30px;
      letter-spacing: 0.16em;
      position: absolute;
      right: 30px;
      text-transform: uppercase;
      z-index: 4;
    }

    .marks i {
      background: #111;
      height: 1px;
      margin-top: 0.5em;
    }
  </style>

  <!-- Screenplay -->
  <om-scene>
    <om-shot duration="15s">
      <div class="print">
        <div class="registration"></div>
        <div class="red-disc"></div>
        <i class="rule"></i>
        <i class="rule rule-thin"></i>

        <om-title class="phrases">
          <strong class="phrase phrase-one">
            <span>Words take</span><span><em>position.</em></span>
          </strong>
          <strong class="phrase phrase-two">
            <span>Order becomes</span><span><em>rhythm.</em></span>
          </strong>
          <strong class="phrase phrase-three">
            <span>Rhythm becomes</span><span><em>motion.</em></span>
          </strong>
          <strong class="phrase phrase-four">
            <span>The story</span><span><em>holds.</em></span>
          </strong>
        </om-title>

        <div class="folio">15</div>
        <div class="marks">
          <span>Onmark / printed motion</span><i></i><span>Edition 01</span>
        </div>
      </div>
    </om-shot>
  </om-scene>

  <!-- Motion -->
  <script type="module" data-om-motion>
    import { combineMotion, createFontResource } from "onmark/authoring";
    import { gsapMotion } from "onmark/motion/gsap";
    import sansUrl from "./assets/fonts/instrument-sans.woff2";
    import sansBoldUrl from "./assets/fonts/instrument-sans-bold.woff2";
    import serifUrl from "./assets/fonts/instrument-serif.woff2";

    const typography = {
      bind() {
        return {
          effects: [],
          resources: [
            fontResource("Instrument Sans", sansUrl, "400", "sans-regular"),
            fontResource("Instrument Sans", sansBoldUrl, "700", "sans-bold"),
            fontResource("Instrument Serif", serifUrl, "400", "serif"),
          ],
        };
      },
    };

    const choreography = gsapMotion({
      shot({ element, timeline }) {
        animatePrintField(timeline, element);
        animatePhrase(timeline, element, ".phrase-one", 0.2, 2.75, -1);
        animatePhrase(timeline, element, ".phrase-two", 3.5, 6.35, 1);
        animatePhrase(timeline, element, ".phrase-three", 7.1, 9.95, -1);
        animatePhrase(timeline, element, ".phrase-four", 10.7, 13.6, 1);
        timeline.to(
          element,
          { duration: 0.55, ease: "power2.in", opacity: 0 },
          14.45,
        );
      },
    });

    export const motion = combineMotion(typography, choreography);

    function fontResource(family, source, weight, id) {
      const face = new FontFace(family, `url(${source}) format("woff2")`, {
        weight,
      });
      return createFontResource({ face, fonts: document.fonts, id });
    }

    function animatePrintField(timeline, element) {
      timeline
        .to(
          element.querySelector(".red-disc"),
          {
            duration: 14.5,
            ease: "sine.inOut",
            scale: 1.55,
            x: "76vw",
            y: "-44vh",
          },
          0,
        )
        .to(
          element.querySelector(".registration"),
          {
            duration: 14.5,
            ease: "sine.inOut",
            rotation: 210,
            x: "104vw",
            y: "48vh",
          },
          0,
        )
        .to(
          element.querySelector(".rule"),
          {
            duration: 14.5,
            ease: "sine.inOut",
            rotation: 13,
            y: "24vh",
          },
          0,
        )
        .to(
          element.querySelector(".rule-thin"),
          {
            duration: 14.5,
            ease: "sine.inOut",
            rotation: -12,
            y: "-20vh",
          },
          0,
        )
        .to(
          element.querySelector(".folio"),
          {
            duration: 14.5,
            ease: "none",
            rotation: -18,
            x: -80,
            y: 40,
          },
          0,
        );
    }

    function animatePhrase(
      timeline,
      element,
      selector,
      enter,
      leave,
      direction,
    ) {
      const phrase = element.querySelector(selector);
      const lines = phrase.querySelectorAll("span");

      timeline
        .fromTo(
          phrase,
          {
            clipPath: direction < 0 ? "inset(0 100% 0 0)" : "inset(0 0 0 100%)",
            opacity: 1,
          },
          {
            clipPath: "inset(0 0% 0 0%)",
            duration: 1.05,
            ease: "expo.out",
          },
          enter,
        )
        .from(
          lines,
          {
            duration: 1.1,
            ease: "expo.out",
            stagger: 0.09,
            x: direction * 58,
          },
          enter,
        )
        .to(
          phrase,
          {
            clipPath: direction < 0 ? "inset(0 0 0 100%)" : "inset(0 100% 0 0)",
            duration: 0.85,
            ease: "expo.in",
          },
          leave,
        );
    }
  </script>
</om-film>
