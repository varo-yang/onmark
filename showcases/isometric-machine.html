<!doctype html>
<om-film>
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body,
    om-film,
    om-scene,
    om-shot {
      display: block;
      height: 100%;
      margin: 0;
      overflow: hidden;
      width: 100%;
    }

    body {
      background: #e7f0ff;
      color: #08152f;
      font-family: "Avenir Next", "Helvetica Neue", sans-serif;
    }

    .stage {
      background:
        radial-gradient(circle at 72% 22%, #fff 0 4%, transparent 28%),
        linear-gradient(145deg, #f3f7ff, #a9c9ff);
      height: 100%;
      overflow: hidden;
      perspective: 1100px;
      position: relative;
    }

    .machine {
      height: 620px;
      left: 52%;
      position: absolute;
      top: 51%;
      transform: translate(-50%, -50%) rotateX(58deg) rotateZ(-36deg);
      transform-style: preserve-3d;
      width: 900px;
    }

    .deck {
      background:
        linear-gradient(90deg, rgb(8 21 47 / 8%) 1px, transparent 1px),
        linear-gradient(rgb(8 21 47 / 8%) 1px, transparent 1px), #dce8fb;
      background-size: 60px 60px;
      border: 2px solid #08152f;
      box-shadow: 32px 32px 0 rgb(8 21 47 / 18%);
      height: 100%;
      position: absolute;
      width: 100%;
    }

    .track {
      background: #08152f;
      height: 86px;
      left: 80px;
      position: absolute;
      top: 270px;
      width: 740px;
    }

    .track::after {
      background: repeating-linear-gradient(
        90deg,
        #d5ff42 0 42px,
        #08152f 42px 58px
      );
      content: "";
      inset: 12px;
      position: absolute;
    }

    .cube {
      background: #ff5c35;
      border: 2px solid #08152f;
      box-shadow:
        -20px 20px 0 #d93a1b,
        -20px 20px 0 2px #08152f;
      height: 76px;
      left: 110px;
      position: absolute;
      top: 220px;
      transform: translateZ(75px);
      width: 76px;
      z-index: 2;
    }

    .cube:nth-of-type(2) {
      background: #6557ff;
      box-shadow:
        -20px 20px 0 #4235c9,
        -20px 20px 0 2px #08152f;
      left: 330px;
    }

    .cube:nth-of-type(3) {
      background: #4ad8c8;
      box-shadow:
        -20px 20px 0 #1b9e92,
        -20px 20px 0 2px #08152f;
      left: 550px;
    }

    .tower {
      background: #fff;
      border: 2px solid #08152f;
      box-shadow:
        -24px 24px 0 #8baee6,
        -24px 24px 0 2px #08152f;
      height: 210px;
      position: absolute;
      right: 70px;
      top: 70px;
      transform: translateZ(105px);
      width: 150px;
    }

    .tower i {
      background: #d5ff42;
      border: 2px solid #08152f;
      border-radius: 50%;
      display: block;
      height: 54px;
      margin: 22px auto;
      width: 54px;
    }

    .copy {
      left: 44px;
      position: absolute;
      top: 38px;
      z-index: 3;
    }

    .copy span {
      display: block;
      font-size: 14px;
      letter-spacing: 0.22em;
      margin-bottom: 10px;
      text-transform: uppercase;
    }

    .copy strong {
      display: block;
      font-size: clamp(70px, 8vw, 160px);
      letter-spacing: -0.07em;
      line-height: 0.82;
    }

    .badge {
      align-items: center;
      background: #08152f;
      border-radius: 999px;
      bottom: 40px;
      color: white;
      display: flex;
      font-size: 14px;
      gap: 12px;
      padding: 13px 18px;
      position: absolute;
      right: 40px;
      text-transform: uppercase;
    }

    .badge i {
      background: #d5ff42;
      border-radius: 50%;
      height: 10px;
      width: 10px;
    }
  </style>

  <om-scene>
    <om-shot duration="9s">
      <div class="stage">
        <om-title class="copy">
          <span>Compiler machinery / 05</span>
          <strong>Intent<br />in motion.</strong>
        </om-title>
        <div class="machine">
          <div class="deck"></div>
          <div class="track"></div>
          <i class="cube"></i><i class="cube"></i><i class="cube"></i>
          <div class="tower"><i></i></div>
        </div>
        <div class="badge"><i></i><span>Pipeline nominal</span></div>
      </div>
    </om-shot>
  </om-scene>

  <script type="module" data-om-motion>
    import { gsapMotion } from "onmark/motion/gsap";

    export const motion = gsapMotion({
      shot({ element, timeline }) {
        const cubes = element.querySelectorAll(".cube");

        timeline
          .from(
            ".machine",
            {
              duration: 1.4,
              ease: "expo.out",
              opacity: 0,
              rotationZ: -55,
              scale: 0.35,
              xPercent: 30,
              yPercent: 20,
            },
            0.1,
          )
          .from(
            ".copy > *",
            {
              duration: 0.85,
              ease: "power3.out",
              opacity: 0,
              stagger: 0.12,
              x: -55,
            },
            0.55,
          )
          .from(
            ".badge",
            {
              duration: 0.65,
              ease: "back.out(1.8)",
              opacity: 0,
              scale: 0.75,
            },
            1.1,
          )
          .to(
            cubes,
            {
              duration: 6.8,
              ease: "none",
              stagger: 0.18,
              x: 540,
            },
            1.1,
          )
          .to(
            ".tower i",
            {
              duration: 6.5,
              ease: "none",
              rotation: 540,
            },
            1.2,
          )
          .to(
            ".machine",
            {
              duration: 7,
              ease: "sine.inOut",
              rotationX: "+=5",
              rotationZ: "+=12",
              scale: 1.08,
              xPercent: -4,
            },
            1.2,
          )
          .to(
            ".stage",
            {
              duration: 0.95,
              ease: "expo.in",
              filter: "blur(15px)",
              scale: 1.16,
            },
            8,
          );
      },
    });
  </script>
</om-film>
