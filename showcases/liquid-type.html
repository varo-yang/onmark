<!doctype html>
<om-film>
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body,
    om-film,
    om-scene,
    om-shot {
      display: block;
      height: 100%;
      margin: 0;
      overflow: hidden;
      width: 100%;
    }

    body {
      background: #ede9dd;
      color: #11110f;
      font-family: "Helvetica Neue", Arial, sans-serif;
    }

    .world {
      height: 100%;
      isolation: isolate;
      overflow: hidden;
      position: relative;
      width: 100%;
    }

    .field {
      background:
        radial-gradient(circle at 24% 18%, #ff5f45 0 14%, transparent 31%),
        radial-gradient(circle at 80% 78%, #7157ff 0 13%, transparent 32%),
        radial-gradient(circle at 64% 24%, #d6ff58 0 12%, transparent 29%),
        #ede9dd;
      filter: blur(18px) saturate(130%);
      inset: -18%;
      position: absolute;
      transform: scale(1.1);
    }

    .orbit {
      border: 2px solid rgb(17 17 15 / 70%);
      border-radius: 50%;
      left: 50%;
      position: absolute;
      top: 50%;
      transform: translate(-50%, -50%);
    }

    .orbit-a {
      height: 42vw;
      width: 42vw;
    }

    .orbit-b {
      border-style: dashed;
      height: 68vw;
      width: 68vw;
    }

    .orb {
      background: #11110f;
      border-radius: 50%;
      height: 34px;
      left: 50%;
      position: absolute;
      top: -17px;
      width: 34px;
    }

    .title {
      font-family: "Arial Black", "Helvetica Neue", sans-serif;
      font-size: clamp(92px, 14vw, 270px);
      font-weight: 800;
      left: 50%;
      letter-spacing: -0.085em;
      line-height: 0.76;
      margin: 0;
      mix-blend-mode: multiply;
      position: absolute;
      text-align: center;
      text-transform: uppercase;
      top: 50%;
      transform: translate(-50%, -50%);
      width: 90%;
      z-index: 2;
    }

    .title span {
      display: block;
    }

    .meta {
      align-items: center;
      display: flex;
      font-size: 18px;
      font-weight: 600;
      justify-content: space-between;
      left: 42px;
      letter-spacing: 0.08em;
      position: absolute;
      right: 42px;
      text-transform: uppercase;
      top: 34px;
      z-index: 3;
    }

    .progress {
      background: #11110f;
      bottom: 36px;
      height: 5px;
      left: 42px;
      position: absolute;
      transform-origin: left center;
      width: calc(100% - 84px);
      z-index: 3;
    }

    .grain {
      background-image:
        repeating-radial-gradient(
          circle at 23% 31%,
          rgb(0 0 0 / 16%) 0 1px,
          transparent 1px 4px
        ),
        repeating-linear-gradient(
          117deg,
          rgb(255 255 255 / 8%) 0 1px,
          transparent 1px 5px
        );
      inset: 0;
      mix-blend-mode: soft-light;
      opacity: 0.2;
      pointer-events: none;
      position: absolute;
      z-index: 4;
    }
  </style>

  <om-scene>
    <om-shot duration="9s">
      <div class="world">
        <div class="field"></div>
        <div class="orbit orbit-a"><i class="orb"></i></div>
        <div class="orbit orbit-b"><i class="orb"></i></div>
        <div class="meta">
          <span>Motion as matter</span><span>01 / 20</span>
        </div>
        <om-title class="title"><span>Shape</span><span>Time</span></om-title>
        <div class="progress"></div>
        <div class="grain"></div>
      </div>
    </om-shot>
  </om-scene>

  <script type="module" data-om-motion>
    import { gsapMotion } from "onmark/motion/gsap";

    export const motion = gsapMotion({
      shot({ element, timeline }) {
        const field = element.querySelector(".field");
        const titleLines = element.querySelectorAll(".title span");
        const orbits = element.querySelectorAll(".orbit");

        timeline
          .fromTo(
            titleLines,
            { filter: "blur(34px)", scale: 1.7, yPercent: 80 },
            {
              duration: 1.4,
              ease: "expo.out",
              filter: "blur(0px)",
              scale: 1,
              stagger: 0.08,
              yPercent: 0,
            },
            0.15,
          )
          .to(
            field,
            {
              duration: 9,
              ease: "sine.inOut",
              rotation: 46,
              scale: 1.28,
              xPercent: 7,
              yPercent: -5,
            },
            0,
          )
          .to(orbits[0], { duration: 9, ease: "none", rotation: 190 }, 0)
          .to(orbits[1], { duration: 9, ease: "none", rotation: -125 }, 0)
          .fromTo(
            ".progress",
            { scaleX: 0 },
            { duration: 8.7, ease: "none", scaleX: 1 },
            0.3,
          )
          .to(
            titleLines,
            {
              duration: 1,
              ease: "expo.in",
              filter: "blur(24px)",
              scale: 0.78,
              stagger: 0.04,
              yPercent: -110,
            },
            7.75,
          );
      },
    });
  </script>
</om-film>
