<!doctype html>
<om-film>
  <om-music src="assets/pulse.wav" gain="14%"></om-music>
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body,
    om-film,
    om-scene,
    om-shot {
      display: block;
      height: 100%;
      margin: 0;
      overflow: hidden;
      width: 100%;
    }

    body {
      background: #080808;
      color: #f2ede3;
      font-family: "Helvetica Neue", Arial, sans-serif;
    }

    .documentary {
      height: 100%;
      isolation: isolate;
      overflow: hidden;
      position: relative;
    }

    video {
      filter: grayscale(1) contrast(1.3) brightness(0.72);
      height: 100%;
      inset: 0;
      object-fit: cover;
      position: absolute;
      width: 100%;
    }

    .wash {
      background:
        linear-gradient(90deg, rgb(0 0 0 / 68%), transparent 45%),
        linear-gradient(0deg, rgb(0 0 0 / 70%), transparent 38%);
      inset: 0;
      pointer-events: none;
      position: absolute;
    }

    .label {
      left: 42px;
      position: absolute;
      top: 36px;
      z-index: 2;
    }

    .label small {
      color: #e34b35;
      display: block;
      font-family: "Courier New", monospace;
      font-size: 13px;
      letter-spacing: 0.2em;
      margin-bottom: 14px;
      text-transform: uppercase;
    }

    .label strong {
      display: block;
      font-family: Georgia, serif;
      font-size: clamp(72px, 9vw, 172px);
      font-weight: 400;
      letter-spacing: -0.06em;
      line-height: 0.82;
    }

    om-caption {
      bottom: 52px;
      color: #f2ede3;
      display: block;
      font-family: Georgia, serif;
      font-size: clamp(32px, 3.7vw, 70px);
      font-style: italic;
      left: 7%;
      letter-spacing: -0.025em;
      line-height: 1;
      max-width: 74%;
      position: absolute;
      text-shadow: 0 3px 18px rgb(0 0 0 / 80%);
      z-index: 3;
    }

    .timecode {
      bottom: 42px;
      font-family: "Courier New", monospace;
      font-size: 13px;
      letter-spacing: 0.13em;
      position: absolute;
      right: 42px;
      z-index: 3;
    }
  </style>

  <om-scene>
    <om-shot>
      <video src="assets/fractal.mp4"></video>
      <div class="documentary">
        <div class="wash"></div>
        <om-title class="label">
          <small>Field notes / 14</small>
          <strong>Time,<br />observed.</strong>
        </om-title>
        <div class="timecode">00:00:10:00</div>
      </div>
    </om-shot>
  </om-scene>

  <script type="module" data-om-motion>
    import { gsapMotion } from "onmark/motion/gsap";

    export const motion = gsapMotion({
      shot({ element, timeline }) {
        timeline
          .from(
            ".label > *",
            {
              duration: 1,
              ease: "expo.out",
              opacity: 0,
              stagger: 0.12,
              x: -55,
            },
            0.15,
          )
          .to(
            "video",
            {
              duration: 9.8,
              ease: "none",
              scale: 1.14,
              xPercent: -3,
            },
            0,
          )
          .to(
            ".wash",
            {
              duration: 7,
              ease: "sine.inOut",
              opacity: 0.58,
            },
            1.5,
          );
      },
      caption({ durationSeconds, element, timeline }) {
        timeline
          .from(
            element,
            {
              duration: 0.45,
              ease: "power3.out",
              filter: "blur(8px)",
              opacity: 0,
              y: 24,
            },
            0,
          )
          .to(
            element,
            {
              duration: 0.35,
              ease: "power2.in",
              filter: "blur(6px)",
              opacity: 0,
              y: -14,
            },
            Math.max(0.45, durationSeconds - 0.35),
          );
      },
    });
  </script>
</om-film>
