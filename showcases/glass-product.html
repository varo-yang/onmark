<!doctype html>
<om-film>
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body,
    om-film,
    om-scene,
    om-shot {
      display: block;
      height: 100%;
      margin: 0;
      overflow: hidden;
      width: 100%;
    }

    body {
      background: #090a13;
      color: #f7f5ff;
      font-family: "Avenir Next", "Helvetica Neue", sans-serif;
    }

    .world {
      background:
        radial-gradient(
          circle at 25% 20%,
          rgb(118 87 255 / 60%),
          transparent 34%
        ),
        radial-gradient(
          circle at 78% 72%,
          rgb(0 229 194 / 45%),
          transparent 30%
        ),
        #090a13;
      height: 100%;
      overflow: hidden;
      perspective: 1200px;
      position: relative;
    }

    .dashboard {
      height: 610px;
      left: 50%;
      position: absolute;
      top: 52%;
      transform: translate(-50%, -50%) rotateX(12deg) rotateY(-12deg);
      transform-style: preserve-3d;
      width: 980px;
    }

    .panel {
      backdrop-filter: blur(28px);
      background: linear-gradient(
        135deg,
        rgb(255 255 255 / 18%),
        rgb(255 255 255 / 5%)
      );
      border: 1px solid rgb(255 255 255 / 24%);
      border-radius: 28px;
      box-shadow: 0 35px 90px rgb(0 0 0 / 42%);
      overflow: hidden;
      position: absolute;
    }

    .main {
      height: 500px;
      left: 100px;
      padding: 30px;
      top: 50px;
      width: 720px;
    }

    .side {
      height: 310px;
      padding: 24px;
      right: -45px;
      top: 145px;
      transform: translateZ(90px);
      width: 260px;
    }

    .nav {
      align-items: center;
      display: flex;
      font-size: 13px;
      justify-content: space-between;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .nav i {
      background: #00e5c2;
      border-radius: 50%;
      box-shadow: 0 0 28px #00e5c2;
      display: inline-block;
      height: 10px;
      margin-right: 10px;
      width: 10px;
    }

    .metric {
      font-size: 130px;
      font-weight: 600;
      letter-spacing: -0.08em;
      line-height: 0.9;
      margin-top: 52px;
    }

    .metric small {
      color: #00e5c2;
      font-size: 24px;
      letter-spacing: 0;
    }

    .chart {
      align-items: end;
      display: flex;
      gap: 12px;
      height: 150px;
      margin-top: 42px;
    }

    .chart i {
      background: linear-gradient(#7657ff, #00e5c2);
      border-radius: 8px 8px 2px 2px;
      flex: 1;
      height: var(--height);
      transform-origin: center bottom;
    }

    .side strong {
      display: block;
      font-size: 50px;
      letter-spacing: -0.06em;
      margin: 42px 0 8px;
    }

    .side span {
      color: rgb(255 255 255 / 64%);
      font-size: 14px;
      line-height: 1.5;
    }

    .cursor {
      background: #fff;
      border-radius: 50% 50% 50% 0;
      box-shadow: 0 0 28px rgb(255 255 255 / 45%);
      height: 26px;
      left: 48%;
      position: absolute;
      top: 58%;
      transform: rotate(-42deg);
      width: 26px;
      z-index: 5;
    }

    .headline {
      font-size: 16px;
      left: 38px;
      letter-spacing: 0.18em;
      position: absolute;
      text-transform: uppercase;
      top: 32px;
    }
  </style>

  <om-scene>
    <om-shot duration="9s">
      <div class="world">
        <om-title class="headline"
          >One source · every exact frame · 08 / 20</om-title
        >
        <div class="dashboard">
          <section class="panel main">
            <div class="nav">
              <span><i></i>Render health</span><span>Live facts</span>
            </div>
            <div class="metric">4.18<small>× faster</small></div>
            <div class="chart">
              <i style="--height: 36%"></i><i style="--height: 54%"></i>
              <i style="--height: 42%"></i><i style="--height: 78%"></i>
              <i style="--height: 68%"></i><i style="--height: 94%"></i>
              <i style="--height: 82%"></i><i style="--height: 100%"></i>
            </div>
          </section>
          <aside class="panel side">
            <div class="nav"><span>Memory</span><span>↓</span></div>
            <strong>−20%</strong>
            <span
              >Native media stays decoded while browser motion remains
              transparent.</span
            >
          </aside>
        </div>
        <div class="cursor"></div>
      </div>
    </om-shot>
  </om-scene>

  <script type="module" data-om-motion>
    import { gsapMotion } from "onmark/motion/gsap";

    export const motion = gsapMotion({
      shot({ element, timeline }) {
        const bars = element.querySelectorAll(".chart i");

        timeline
          .from(
            ".dashboard",
            {
              duration: 1.4,
              ease: "expo.out",
              filter: "blur(24px)",
              opacity: 0,
              rotationX: 32,
              rotationY: -32,
              scale: 0.6,
              z: -400,
            },
            0.1,
          )
          .from(
            ".headline",
            {
              duration: 0.7,
              ease: "power3.out",
              letterSpacing: "0.5em",
              opacity: 0,
            },
            0.7,
          )
          .from(
            bars,
            {
              duration: 1.1,
              ease: "elastic.out(1, 0.4)",
              scaleY: 0,
              stagger: 0.07,
            },
            1.05,
          )
          .from(
            ".side",
            {
              duration: 1,
              ease: "expo.out",
              opacity: 0,
              x: 130,
              z: -100,
            },
            1.25,
          )
          .to(
            ".cursor",
            {
              duration: 2.4,
              ease: "power3.inOut",
              left: "78%",
              top: "38%",
            },
            2.1,
          )
          .to(
            ".dashboard",
            {
              duration: 6.5,
              ease: "sine.inOut",
              rotationX: 6,
              rotationY: 10,
              scale: 1.08,
            },
            1.5,
          )
          .to(
            ".world",
            {
              duration: 1,
              ease: "expo.in",
              filter: "blur(16px)",
              scale: 1.18,
            },
            7.9,
          );
      },
    });
  </script>
</om-film>
