<!doctype html>
<om-film>
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body,
    om-film,
    om-scene,
    om-shot {
      display: block;
      height: 100%;
      margin: 0;
      overflow: hidden;
      width: 100%;
    }

    body {
      background: #f4f2ec;
      color: #1a2725;
      font-family: "Avenir Next", "Helvetica Neue", sans-serif;
    }

    .network {
      height: 100%;
      overflow: hidden;
      position: relative;
    }

    canvas {
      height: 100%;
      inset: 0;
      position: absolute;
      width: 100%;
    }

    .copy {
      left: 42px;
      position: absolute;
      top: 38px;
      z-index: 2;
    }

    .copy span {
      color: #ed4c32;
      display: block;
      font-family: "Courier New", monospace;
      font-size: 13px;
      letter-spacing: 0.2em;
      margin-bottom: 12px;
      text-transform: uppercase;
    }

    .copy strong {
      display: block;
      font-size: clamp(68px, 8vw, 155px);
      letter-spacing: -0.07em;
      line-height: 0.82;
    }

    .status {
      align-items: center;
      bottom: 38px;
      display: flex;
      font-family: "Courier New", monospace;
      font-size: 13px;
      gap: 12px;
      left: 42px;
      letter-spacing: 0.14em;
      position: absolute;
      text-transform: uppercase;
      z-index: 2;
    }

    .status i {
      background: #00a789;
      border-radius: 50%;
      box-shadow: 0 0 18px #00a789;
      height: 10px;
      width: 10px;
    }
  </style>

  <om-scene>
    <om-shot duration="9s">
      <div class="network">
        <canvas></canvas>
        <om-title class="copy">
          <span>Distributed without drift / 15</span>
          <strong>Many workers.<br />One truth.</strong>
        </om-title>
        <div class="status"><i></i><span>All partitions verified</span></div>
      </div>
    </om-shot>
  </om-scene>

  <script type="module" data-om-motion>
    import { combineMotion } from "onmark/authoring";
    import { gsapMotion } from "onmark/motion/gsap";

    const nodes = Array.from({ length: 44 }, (_, index) => {
      const column = index % 11;
      const row = Math.floor(index / 11);
      return {
        x: 0.12 + column * 0.077 + Math.sin(index * 2.1) * 0.018,
        y: 0.29 + row * 0.17 + Math.cos(index * 1.7) * 0.035,
      };
    });

    const graph = {
      bind(context) {
        const shot = context.targets.find((target) => target.kind === "shot");
        const canvas = shot?.element.querySelector("canvas");
        if (!(canvas instanceof HTMLCanvasElement) || shot === undefined) {
          return { effects: [], resources: [] };
        }

        const width = window.innerWidth;
        const height = window.innerHeight;
        canvas.width = width;
        canvas.height = height;
        const drawing = canvas.getContext("2d");
        if (drawing === null) {
          throw new Error("network showcase requires a 2D canvas");
        }

        return {
          effects: [
            {
              apply(frame) {
                const progress =
                  (frame.index - shot.interval.start) /
                  (shot.interval.end - shot.interval.start);
                drawNetwork(drawing, width, height, progress);
              },
              dispose() {},
            },
          ],
          resources: [],
        };
      },
    };

    const labels = gsapMotion({
      title({ element, timeline }) {
        timeline.from(
          element.children,
          {
            duration: 1,
            ease: "expo.out",
            opacity: 0,
            stagger: 0.1,
            x: -55,
          },
          0.15,
        );
      },
      shot({ element, timeline }) {
        timeline.from(
          element.querySelector(".status"),
          {
            duration: 0.7,
            ease: "power3.out",
            opacity: 0,
            y: 18,
          },
          1.2,
        );
      },
    });

    export const motion = combineMotion(graph, labels);

    function drawNetwork(drawing, width, height, progress) {
      drawing.clearRect(0, 0, width, height);
      const pulse = (progress * 3.2) % 1;
      const visible = Math.min(nodes.length, Math.floor(progress * 72));

      drawing.lineWidth = 1.3;
      for (let index = 0; index < visible; index += 1) {
        const node = nodes[index];
        const next = nodes[(index + 1) % nodes.length];
        const down = nodes[(index + 11) % nodes.length];
        drawing.strokeStyle = "rgb(26 39 37 / 0.16)";
        drawing.beginPath();
        drawing.moveTo(node.x * width, node.y * height);
        drawing.lineTo(next.x * width, next.y * height);
        drawing.moveTo(node.x * width, node.y * height);
        drawing.lineTo(down.x * width, down.y * height);
        drawing.stroke();
      }

      for (let index = 0; index < visible; index += 1) {
        const node = nodes[index];
        const distance = Math.abs(index / nodes.length - pulse);
        const glow = Math.max(0, 1 - distance * 9);
        drawing.fillStyle =
          glow > 0
            ? `rgb(237 76 50 / ${0.45 + glow * 0.55})`
            : "rgb(26 39 37 / 0.7)";
        drawing.beginPath();
        drawing.arc(
          node.x * width,
          node.y * height,
          3 + glow * 11,
          0,
          Math.PI * 2,
        );
        drawing.fill();
      }
    }
  </script>
</om-film>
