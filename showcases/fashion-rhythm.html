<!doctype html>
<om-film>
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body,
    om-film,
    om-scene,
    om-shot {
      display: block;
      height: 100%;
      margin: 0;
      overflow: hidden;
      width: 100%;
    }

    body {
      background: #f3eee7;
      color: #0b0b0b;
      font-family: "Helvetica Neue", Arial, sans-serif;
    }

    .runway {
      height: 100%;
      overflow: hidden;
      position: relative;
    }

    .stripe {
      background: #e92525;
      height: 180%;
      left: 45%;
      position: absolute;
      top: -40%;
      transform: rotate(18deg);
      width: 18%;
    }

    .model {
      background: #0b0b0b;
      bottom: -8%;
      clip-path: polygon(
        42% 0,
        58% 0,
        63% 18%,
        81% 42%,
        67% 100%,
        50% 72%,
        33% 100%,
        19% 42%,
        37% 18%
      );
      height: 90%;
      left: 50%;
      position: absolute;
      transform: translateX(-50%);
      width: 30%;
      z-index: 2;
    }

    .model::before {
      background: #0b0b0b;
      border-radius: 50%;
      content: "";
      height: 14%;
      left: 39%;
      position: absolute;
      top: -6%;
      width: 22%;
    }

    .type {
      font-family: "Arial Black", "Helvetica Neue", sans-serif;
      font-size: clamp(104px, 16vw, 310px);
      font-weight: 900;
      left: -4%;
      letter-spacing: -0.09em;
      line-height: 0.72;
      mix-blend-mode: multiply;
      position: absolute;
      text-transform: uppercase;
      top: 9%;
      width: 110%;
      z-index: 3;
    }

    .type span {
      display: block;
    }

    .type span:nth-child(2) {
      color: transparent;
      margin-left: 28%;
      -webkit-text-stroke: 3px #0b0b0b;
    }

    .caption {
      bottom: 32px;
      display: flex;
      font-family: "Courier New", monospace;
      font-size: 13px;
      justify-content: space-between;
      left: 36px;
      letter-spacing: 0.16em;
      position: absolute;
      right: 36px;
      text-transform: uppercase;
      z-index: 4;
    }

    .flash {
      background: white;
      inset: 0;
      opacity: 0;
      position: absolute;
      z-index: 8;
    }
  </style>

  <om-scene>
    <om-shot duration="8s">
      <div class="runway">
        <div class="stripe"></div>
        <div class="model"></div>
        <om-title class="type"
          ><span>Move</span><span>before</span><span>meaning.</span></om-title
        >
        <div class="caption">
          <span>Atelier 12</span><span>Frame study</span><span>12 / 20</span>
        </div>
        <div class="flash"></div>
      </div>
    </om-shot>
  </om-scene>

  <script type="module" data-om-motion>
    import { gsapMotion } from "onmark/motion/gsap";

    export const motion = gsapMotion({
      shot({ element, timeline }) {
        const lines = element.querySelectorAll(".type span");

        timeline
          .from(
            ".model",
            {
              duration: 1.35,
              ease: "expo.out",
              filter: "blur(20px)",
              scale: 1.8,
              yPercent: 45,
            },
            0.1,
          )
          .from(
            lines,
            {
              duration: 0.95,
              ease: "expo.out",
              stagger: 0.08,
              xPercent: (index) => (index % 2 === 0 ? -110 : 110),
            },
            0.5,
          )
          .from(
            ".caption",
            {
              duration: 0.6,
              ease: "power3.out",
              opacity: 0,
              y: 18,
            },
            1.2,
          )
          .to(
            ".stripe",
            {
              duration: 6.5,
              ease: "sine.inOut",
              rotation: -8,
              scaleX: 1.7,
              xPercent: -55,
            },
            1,
          )
          .to(
            ".model",
            {
              duration: 5.8,
              ease: "sine.inOut",
              rotation: 7,
              scale: 1.08,
              xPercent: 18,
            },
            1.5,
          )
          .to(".flash", { duration: 0.08, opacity: 0.92 }, 3.1)
          .to(".flash", { duration: 0.22, opacity: 0 }, 3.18)
          .to(".flash", { duration: 0.08, opacity: 0.92 }, 5.3)
          .to(".flash", { duration: 0.22, opacity: 0 }, 5.38)
          .to(
            ".runway",
            {
              duration: 0.8,
              ease: "expo.in",
              filter: "blur(18px)",
              scale: 1.25,
            },
            7.15,
          );
      },
    });
  </script>
</om-film>
