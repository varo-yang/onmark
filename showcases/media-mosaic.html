<!doctype html>
<om-film>
  <om-music src="assets/pulse.wav" gain="18%"></om-music>
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body,
    om-film,
    om-scene,
    om-shot {
      display: block;
      height: 100%;
      margin: 0;
      overflow: hidden;
      width: 100%;
    }

    body {
      background: #17142a;
      color: #fff9e8;
      font-family: "Avenir Next", "Helvetica Neue", sans-serif;
    }

    .mosaic {
      background:
        radial-gradient(
          circle at 72% 20%,
          rgb(255 93 74 / 55%),
          transparent 28%
        ),
        linear-gradient(135deg, #17142a, #30235c);
      height: 100%;
      overflow: hidden;
      perspective: 1100px;
      position: relative;
    }

    .screen {
      border: 12px solid #fff9e8;
      border-radius: 24px;
      box-shadow: 34px 42px 0 rgb(4 3 10 / 45%);
      height: 62%;
      left: 50%;
      overflow: hidden;
      position: absolute;
      top: 50%;
      transform: translate(-50%, -50%) rotateY(-14deg) rotateZ(-3deg);
      width: 66%;
      z-index: 2;
    }

    video {
      border-radius: 13px;
      height: 62%;
      left: 50%;
      object-fit: cover;
      position: absolute;
      top: 50%;
      transform: translate(-50%, -50%) rotateY(-14deg) rotateZ(-3deg);
      width: 66%;
      z-index: 1;
    }

    .shine {
      background: linear-gradient(
        115deg,
        transparent 35%,
        rgb(255 255 255 / 24%) 48%,
        transparent 61%
      );
      inset: 0;
      position: absolute;
      transform: translateX(-120%);
    }

    .chip {
      align-items: center;
      backdrop-filter: blur(18px);
      background: rgb(255 255 255 / 16%);
      border: 1px solid rgb(255 255 255 / 35%);
      border-radius: 18px;
      display: flex;
      font-size: 15px;
      gap: 12px;
      padding: 16px 20px;
      position: absolute;
      z-index: 3;
    }

    .chip i {
      background: #a5ff62;
      border-radius: 50%;
      box-shadow: 0 0 20px #a5ff62;
      height: 11px;
      width: 11px;
    }

    .chip-a {
      left: 7%;
      top: 24%;
    }

    .chip-b {
      bottom: 18%;
      right: 7%;
    }

    .copy {
      bottom: 34px;
      left: 38px;
      position: absolute;
      z-index: 4;
    }

    .copy span {
      color: #a5ff62;
      display: block;
      font-size: 13px;
      letter-spacing: 0.22em;
      margin-bottom: 10px;
      text-transform: uppercase;
    }

    .copy strong {
      display: block;
      font-size: clamp(54px, 6vw, 118px);
      letter-spacing: -0.065em;
      line-height: 0.86;
    }

    .counter {
      font-family: "Courier New", monospace;
      font-size: 13px;
      letter-spacing: 0.14em;
      position: absolute;
      right: 36px;
      top: 32px;
      z-index: 4;
    }
  </style>

  <om-scene>
    <om-shot>
      <video src="assets/fractal.mp4"></video>
      <div class="mosaic">
        <div class="screen"><div class="shine"></div></div>
        <div class="chip chip-a"><i></i><span>Media stays decoded</span></div>
        <div class="chip chip-b">
          <i></i><span>Browser motion stays free</span>
        </div>
        <om-title class="copy">
          <span>Native media composition</span>
          <strong>Footage is material.</strong>
        </om-title>
        <div class="counter">13 / 20</div>
      </div>
    </om-shot>
  </om-scene>

  <script type="module" data-om-motion>
    import { gsapMotion } from "onmark/motion/gsap";

    export const motion = gsapMotion({
      shot({ element, timeline }) {
        const media = element.querySelectorAll("video, .screen");

        timeline
          .from(
            media,
            {
              duration: 1.4,
              ease: "expo.out",
              filter: "blur(24px)",
              opacity: 0,
              rotationY: -48,
              scale: 0.55,
              z: -500,
            },
            0.1,
          )
          .from(
            ".chip",
            {
              duration: 0.75,
              ease: "back.out(1.7)",
              opacity: 0,
              scale: 0.7,
              stagger: 0.2,
            },
            1,
          )
          .from(
            ".copy > *",
            {
              duration: 0.9,
              ease: "power3.out",
              opacity: 0,
              stagger: 0.1,
              x: -45,
            },
            1.15,
          )
          .to(
            media,
            {
              duration: 7.8,
              ease: "sine.inOut",
              rotationY: 8,
              rotationZ: 2,
              scale: 1.08,
              xPercent: 5,
            },
            1.2,
          )
          .to(
            ".shine",
            {
              duration: 1.3,
              ease: "power2.inOut",
              xPercent: 240,
            },
            3.6,
          )
          .to(
            ".mosaic",
            {
              duration: 0.9,
              ease: "expo.in",
              filter: "blur(15px)",
              scale: 1.18,
            },
            9,
          );
      },
    });
  </script>
</om-film>
