<!doctype html>
<om-film>
  <!-- Presentation -->
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body,
    om-film,
    om-scene,
    om-shot {
      display: block;
      height: 100%;
      margin: 0;
      overflow: hidden;
      width: 100%;
    }

    body {
      background: #e8e0d2;
      color: #141414;
      font-family: "Instrument Sans", sans-serif;
    }

    .stage {
      background:
        radial-gradient(
          circle at 62% 46%,
          rgb(255 255 255 / 90%),
          transparent 28%
        ),
        #e8e0d2;
      height: 100%;
      overflow: hidden;
      perspective: 1500px;
      position: relative;
    }

    .halo {
      border: 1px solid rgb(20 20 20 / 20%);
      border-radius: 50%;
      height: min(62vw, 96vh);
      left: 62%;
      position: absolute;
      top: 50%;
      transform: translate(-50%, -50%) scale(0);
      width: min(62vw, 96vh);
    }

    .halo::before,
    .halo::after {
      border: 1px solid rgb(20 20 20 / 12%);
      border-radius: inherit;
      content: "";
      inset: 9%;
      position: absolute;
    }

    .halo::after {
      inset: 20%;
    }

    .product {
      height: min(61vh, 660px);
      left: 62%;
      opacity: 0;
      position: absolute;
      top: 50%;
      transform: translate(-50%, -50%);
      transform-style: preserve-3d;
      width: min(27vw, 480px);
      z-index: 3;
    }

    .case,
    .screen,
    .back {
      border-radius: 12%;
      inset: 0;
      position: absolute;
      transform-style: preserve-3d;
    }

    .case {
      background: #171717;
      box-shadow:
        0 60px 90px rgb(49 35 17 / 30%),
        inset 0 0 0 2px rgb(255 255 255 / 10%);
    }

    .back {
      background: #ff593b;
      inset: 4%;
      transform: translateZ(-42px);
    }

    .screen {
      background: #0b0c0c;
      color: #f0eadf;
      inset: 4%;
      overflow: hidden;
      padding: 10%;
      transform: translateZ(24px);
    }

    .screen::before {
      background: linear-gradient(
        120deg,
        rgb(255 255 255 / 16%),
        transparent 34%
      );
      content: "";
      inset: 0;
      pointer-events: none;
      position: absolute;
    }

    .screen-head {
      display: flex;
      font-size: clamp(8px, 0.6vw, 13px);
      font-weight: 700;
      justify-content: space-between;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    .reading {
      bottom: 13%;
      left: 10%;
      position: absolute;
      right: 10%;
    }

    .reading strong {
      display: block;
      font-size: clamp(82px, 8vw, 148px);
      letter-spacing: -0.08em;
      line-height: 0.72;
    }

    .reading small {
      color: #ff765d;
      display: block;
      font-family: "Instrument Serif", serif;
      font-size: clamp(18px, 1.3vw, 25px);
      margin-top: 22px;
    }

    .meter {
      display: flex;
      gap: 7px;
      height: 34%;
      left: 10%;
      position: absolute;
      right: 10%;
      top: 17%;
    }

    .meter i {
      background: #ff593b;
      flex: 1;
      transform: scaleY(0.08);
      transform-origin: bottom;
    }

    .crown {
      background: #171717;
      border-radius: 0 10px 10px 0;
      box-shadow: inset 0 0 0 1px rgb(255 255 255 / 12%);
      height: 14%;
      position: absolute;
      right: -5%;
      top: 21%;
      width: 6%;
    }

    .copy {
      left: 6%;
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 34%;
      z-index: 4;
    }

    .copy small {
      display: block;
      font-size: clamp(10px, 0.72vw, 14px);
      font-weight: 700;
      letter-spacing: 0.16em;
      margin-bottom: 28px;
      text-transform: uppercase;
    }

    .copy strong {
      display: block;
      font-size: clamp(72px, 8vw, 150px);
      letter-spacing: -0.075em;
      line-height: 0.78;
    }

    .copy em {
      color: #ff593b;
      font-family: "Instrument Serif", serif;
      font-weight: 400;
    }

    .index {
      bottom: 28px;
      display: flex;
      font-size: clamp(9px, 0.65vw, 13px);
      font-weight: 700;
      justify-content: space-between;
      left: 30px;
      letter-spacing: 0.14em;
      position: absolute;
      right: 30px;
      text-transform: uppercase;
    }
  </style>

  <!-- Screenplay -->
  <om-scene>
    <om-shot duration="12s">
      <div class="stage">
        <div class="halo"></div>

        <div class="product">
          <div class="back"></div>
          <div class="case"></div>
          <div class="screen">
            <div class="screen-head">
              <span>Frame / One</span><span>Exact</span>
            </div>
            <div class="meter">
              <i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i>
            </div>
            <div class="reading">
              <strong>24</strong>
              <small>frames held in perfect time</small>
            </div>
          </div>
          <i class="crown"></i>
        </div>

        <om-title class="copy">
          <small>Instrument one / temporal object</small>
          <strong>Time<br />you can<br /><em>hold.</em></strong>
        </om-title>

        <div class="index"><span>Onmark objects</span><span>01 / 04</span></div>
      </div>
    </om-shot>
  </om-scene>

  <!-- Motion -->
  <script type="module" data-om-motion>
    import { combineMotion, createFontResource } from "onmark/authoring";
    import { gsapMotion } from "onmark/motion/gsap";
    import sansUrl from "./assets/fonts/instrument-sans.woff2";
    import sansBoldUrl from "./assets/fonts/instrument-sans-bold.woff2";
    import serifUrl from "./assets/fonts/instrument-serif.woff2";

    const typography = {
      bind() {
        return {
          effects: [],
          resources: [
            fontResource("Instrument Sans", sansUrl, "400", "sans-regular"),
            fontResource("Instrument Sans", sansBoldUrl, "700", "sans-bold"),
            fontResource("Instrument Serif", serifUrl, "400", "serif"),
          ],
        };
      },
    };

    const choreography = gsapMotion({
      shot({ element, timeline }) {
        revealProduct(timeline, element);
        exposeLayers(timeline, element);
        closeProduct(timeline, element);
      },
    });

    export const motion = combineMotion(typography, choreography);

    function fontResource(family, source, weight, id) {
      const face = new FontFace(family, `url(${source}) format("woff2")`, {
        weight,
      });
      return createFontResource({ face, fonts: document.fonts, id });
    }

    function revealProduct(timeline, element) {
      const copy = element.querySelector(".copy");
      const halo = element.querySelector(".halo");
      const meter = element.querySelectorAll(".meter i");
      const product = element.querySelector(".product");

      timeline
        .from(
          copy,
          {
            duration: 1.2,
            ease: "expo.out",
            opacity: 0,
            x: -70,
          },
          0.2,
        )
        .to(halo, { duration: 2.2, ease: "expo.out", scale: 1 }, 0.2)
        .fromTo(
          product,
          {
            opacity: 0,
            rotateX: 18,
            rotateY: -48,
            rotateZ: 8,
            scale: 0.62,
            xPercent: 32,
          },
          {
            duration: 2.6,
            ease: "expo.out",
            opacity: 1,
            rotateX: -3,
            rotateY: -16,
            rotateZ: -2,
            scale: 1,
            xPercent: 0,
          },
          0.4,
        )
        .to(
          meter,
          {
            duration: 1,
            ease: "back.out(1.8)",
            scaleY: (index) => 0.25 + ((index * 17) % 67) / 100,
            stagger: 0.06,
          },
          1.8,
        );
    }

    function exposeLayers(timeline, element) {
      const back = element.querySelector(".back");
      const product = element.querySelector(".product");
      const screen = element.querySelector(".screen");

      timeline
        .to(
          product,
          {
            duration: 2.8,
            ease: "sine.inOut",
            rotateX: 6,
            rotateY: 20,
            rotateZ: 3,
            scale: 1.07,
          },
          3.1,
        )
        .to(
          screen,
          {
            duration: 2,
            ease: "expo.inOut",
            rotateY: -4,
            xPercent: -9,
            z: 130,
          },
          5.2,
        )
        .to(
          back,
          {
            duration: 2,
            ease: "expo.inOut",
            rotateY: 5,
            xPercent: 10,
            z: -130,
          },
          5.2,
        )
        .to(
          product,
          {
            duration: 2.2,
            ease: "sine.inOut",
            rotateX: -5,
            rotateY: -10,
            rotateZ: -1,
          },
          6.8,
        );
    }

    function closeProduct(timeline, element) {
      const layers = element.querySelectorAll(".back, .screen");
      const stage = element.querySelector(".stage");

      timeline
        .to(
          layers,
          {
            duration: 1.5,
            ease: "expo.inOut",
            rotateY: 0,
            xPercent: 0,
            z: (index) => [-42, 24][index],
          },
          8.7,
        )
        .to(
          element.querySelector(".product"),
          {
            duration: 1.4,
            ease: "expo.inOut",
            rotateX: 0,
            rotateY: 0,
            rotateZ: 0,
            scale: 0.86,
          },
          9,
        )
        .to(stage, { duration: 0.7, ease: "power2.in", opacity: 0 }, 11.3);
    }
  </script>
</om-film>
