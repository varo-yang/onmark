<!doctype html>
<om-film>
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body,
    om-film,
    om-scene,
    om-shot {
      display: block;
      height: 100%;
      margin: 0;
      overflow: hidden;
      width: 100%;
    }

    body {
      background: #02020a;
      color: #f8f4ff;
      font-family: "Helvetica Neue", Arial, sans-serif;
    }

    .aurora {
      height: 100%;
      overflow: hidden;
      position: relative;
    }

    canvas {
      height: 100%;
      inset: 0;
      position: absolute;
      width: 100%;
    }

    .copy {
      left: 50%;
      position: absolute;
      text-align: center;
      top: 50%;
      transform: translate(-50%, -50%);
      width: 90%;
      z-index: 2;
    }

    .copy span {
      display: block;
      font-size: 15px;
      letter-spacing: 0.42em;
      margin-bottom: 22px;
      text-transform: uppercase;
    }

    .copy strong {
      display: block;
      font-size: clamp(88px, 13vw, 250px);
      font-weight: 300;
      letter-spacing: -0.075em;
      line-height: 0.8;
    }

    .frame {
      border: 1px solid rgb(255 255 255 / 50%);
      inset: 28px;
      pointer-events: none;
      position: absolute;
      z-index: 3;
    }

    .index {
      bottom: 42px;
      font-family: "Courier New", monospace;
      font-size: 13px;
      letter-spacing: 0.16em;
      position: absolute;
      right: 42px;
      z-index: 4;
    }
  </style>

  <om-scene>
    <om-shot duration="9s">
      <div class="aurora">
        <canvas></canvas>
        <div class="frame"></div>
        <om-title class="copy">
          <span>Fragment / time / color</span>
          <strong>Light obeys<br />the frame.</strong>
        </om-title>
        <div class="index">10 / 20</div>
      </div>
    </om-shot>
  </om-scene>

  <script type="module" data-om-motion>
    import { combineMotion } from "onmark/authoring";
    import { gsapMotion } from "onmark/motion/gsap";

    const shader = {
      bind(context) {
        const shot = context.targets.find((target) => target.kind === "shot");
        const canvas = shot?.element.querySelector("canvas");
        if (!(canvas instanceof HTMLCanvasElement) || shot === undefined) {
          return { effects: [], resources: [] };
        }

        const gl = canvas.getContext("webgl", {
          antialias: false,
          depth: false,
          preserveDrawingBuffer: true,
        });
        if (gl === null) {
          throw new Error("shader showcase requires WebGL");
        }
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        gl.viewport(0, 0, canvas.width, canvas.height);

        const program = createProgram(gl, vertexSource, fragmentSource);
        const position = gl.getAttribLocation(program, "position");
        const time = gl.getUniformLocation(program, "time");
        const resolution = gl.getUniformLocation(program, "resolution");
        const buffer = gl.createBuffer();
        if (buffer === null || time === null || resolution === null) {
          throw new Error("shader showcase could not create its GPU state");
        }
        gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
        gl.bufferData(
          gl.ARRAY_BUFFER,
          new Float32Array([-1, -1, 3, -1, -1, 3]),
          gl.STATIC_DRAW,
        );
        gl.useProgram(program);
        gl.enableVertexAttribArray(position);
        gl.vertexAttribPointer(position, 2, gl.FLOAT, false, 0, 0);
        gl.uniform2f(resolution, canvas.width, canvas.height);

        return {
          effects: [
            {
              apply(frame) {
                const seconds =
                  ((frame.index - shot.interval.start) *
                    context.frameRate.denominator) /
                  context.frameRate.numerator;
                gl.uniform1f(time, seconds);
                gl.drawArrays(gl.TRIANGLES, 0, 3);
              },
              dispose() {
                gl.deleteBuffer(buffer);
                gl.deleteProgram(program);
              },
            },
          ],
          resources: [],
        };
      },
    };

    const typography = gsapMotion({
      title({ element, timeline }) {
        timeline
          .from(
            element.querySelector("strong"),
            {
              duration: 1.5,
              ease: "expo.out",
              filter: "blur(28px)",
              letterSpacing: "0.12em",
              opacity: 0,
              scale: 1.4,
            },
            0.15,
          )
          .from(
            element.querySelector("span"),
            {
              duration: 0.8,
              ease: "power3.out",
              opacity: 0,
              y: 20,
            },
            1,
          )
          .to(
            element,
            {
              duration: 1,
              ease: "expo.in",
              filter: "blur(28px)",
              letterSpacing: "-0.14em",
              opacity: 0,
              scale: 1.8,
            },
            7.8,
          );
      },
    });

    export const motion = combineMotion(shader, typography);

    function createProgram(gl, vertex, fragment) {
      const program = gl.createProgram();
      if (program === null) {
        throw new Error("shader showcase could not create a program");
      }
      const vertexShader = compileShader(gl, gl.VERTEX_SHADER, vertex);
      const fragmentShader = compileShader(gl, gl.FRAGMENT_SHADER, fragment);
      gl.attachShader(program, vertexShader);
      gl.attachShader(program, fragmentShader);
      gl.linkProgram(program);
      gl.deleteShader(vertexShader);
      gl.deleteShader(fragmentShader);
      if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
        const message = gl.getProgramInfoLog(program) ?? "unknown link failure";
        gl.deleteProgram(program);
        throw new Error(`shader showcase link failed: ${message}`);
      }
      return program;
    }

    function compileShader(gl, kind, source) {
      const shader = gl.createShader(kind);
      if (shader === null) {
        throw new Error("shader showcase could not allocate a shader");
      }
      gl.shaderSource(shader, source);
      gl.compileShader(shader);
      if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
        const message =
          gl.getShaderInfoLog(shader) ?? "unknown compilation failure";
        gl.deleteShader(shader);
        throw new Error(`shader showcase compilation failed: ${message}`);
      }
      return shader;
    }

    const vertexSource = `
      attribute vec2 position;
      void main() {
        gl_Position = vec4(position, 0.0, 1.0);
      }
    `;

    const fragmentSource = `
      precision highp float;
      uniform vec2 resolution;
      uniform float time;

      float hash(vec2 point) {
        return fract(sin(dot(point, vec2(127.1, 311.7))) * 43758.5453123);
      }

      float noise(vec2 point) {
        vec2 cell = floor(point);
        vec2 local = fract(point);
        vec2 smoothLocal = local * local * (3.0 - 2.0 * local);
        return mix(
          mix(hash(cell), hash(cell + vec2(1.0, 0.0)), smoothLocal.x),
          mix(hash(cell + vec2(0.0, 1.0)), hash(cell + 1.0), smoothLocal.x),
          smoothLocal.y
        );
      }

      float field(vec2 point) {
        float value = 0.0;
        float weight = 0.55;
        for (int octave = 0; octave < 5; octave += 1) {
          value += noise(point) * weight;
          point = point * 2.03 + 7.41;
          weight *= 0.5;
        }
        return value;
      }

      void main() {
        vec2 uv = (gl_FragCoord.xy * 2.0 - resolution) / resolution.y;
        float drift = time * 0.12;
        float ribbons = field(vec2(uv.x * 1.5 + drift, uv.y * 2.4 - drift));
        float wave = sin(uv.x * 2.2 + ribbons * 5.0 - time * 0.45);
        float glow = exp(-5.0 * abs(uv.y - wave * 0.24));
        vec3 violet = vec3(0.22, 0.08, 0.72);
        vec3 cyan = vec3(0.0, 0.9, 0.82);
        vec3 rose = vec3(1.0, 0.12, 0.48);
        vec3 color = mix(violet, cyan, ribbons);
        color = mix(color, rose, glow * 0.65);
        color *= 0.28 + glow * 1.4 + ribbons * 0.35;
        gl_FragColor = vec4(pow(color, vec3(0.82)), 1.0);
      }
    `;
  </script>
</om-film>
