name: Desktop release

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/desktop-release.yml
      - Cargo.lock
      - Cargo.toml
      - packages/*/package.json
      - rust-toolchain.toml
      - scripts/release/media-toolchain/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  source:
    name: Resolve release source
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    outputs:
      revision: ${{ steps.identity.outputs.revision }}
      version: ${{ steps.identity.outputs.version }}

    steps:
      - name: Resolve release identity
        id: identity
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_branch=
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            release_branch="$(
              gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" \
                --jq '
                  [.[] | select(
                    .merged_at != null and
                    (.head.ref | startswith("release/v"))
                  )] |
                  if length == 0 then ""
                  elif length == 1 then .[0].head.ref
                  else error("main revision belongs to multiple release pull requests")
                  end
                '
            )"
          fi

          if [[ -n "$release_branch" ]]; then
            release_version="${release_branch#release/v}"
          else
            release_version=
          fi
          echo "revision=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          echo "version=$release_version" >> "$GITHUB_OUTPUT"

  admit:
    name: Admit ${{ matrix.target }}
    needs: source
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      SOURCE_REVISION: ${{ needs.source.outputs.revision }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: darwin-arm64
            native-cli: .release/cargo-target/release/onmark
            release-driver: .release/cargo-target/release/onmark-xtask
          - runner: ubuntu-24.04
            target: linux-x64
            native-cli: .release/cargo-target/release/onmark
            release-driver: .release/cargo-target/release/onmark-xtask
          - runner: windows-2025
            target: win32-x64
            native-cli: .release/cargo-target/release/onmark.exe
            release-driver: .release/cargo-target/release/onmark-xtask.exe

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.source.outputs.revision }}

      - name: Restore release media tools
        id: media-cache
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: .release/media
          key: desktop-media-${{ matrix.target }}-${{ hashFiles('scripts/release/media-toolchain/*') }}

      - name: Restore release Cargo artifacts
        id: cargo-cache
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            .release/cargo-target
          key: desktop-cargo-${{ matrix.target }}-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            desktop-cargo-${{ matrix.target }}-${{ hashFiles('rust-toolchain.toml') }}-

      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain

      - name: Install pinned pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 11.9.0

      - name: Install pinned Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 26.4.0

      - name: Install Linux media build tools
        if: steps.media-cache.outputs.cache-hit != 'true' && runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends nasm pkg-config

      - name: Install macOS media build tools
        if: steps.media-cache.outputs.cache-hit != 'true' && runner.os == 'macOS'
        run: brew install pkgconf

      - name: Install Windows media build tools
        if: steps.media-cache.outputs.cache-hit != 'true' && runner.os == 'Windows'
        uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2.32.0
        with:
          install: >-
            make
            diffutils
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-nasm
            mingw-w64-ucrt-x86_64-pkgconf
          msystem: UCRT64
          update: true

      - name: Install TypeScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Admit Linux browser sandbox
        if: runner.os == 'Linux'
        shell: bash
        run: |
          browser="$HOME/.cache/onmark/browser/**/chrome-headless-shell"
          profile=/etc/apparmor.d/onmark-release-admission
          cat <<EOF | sudo tee "$profile" >/dev/null
          abi <abi/4.0>,
          include <tunables/global>

          profile onmark-release-admission $browser flags=(unconfined) {
            userns,
          }
          EOF
          sudo apparmor_parser --replace "$profile"

      - name: Fetch admitted media sources
        if: steps.media-cache.outputs.cache-hit != 'true'
        run: node scripts/release/media-toolchain/fetch.mjs .release/sources

      - name: Build release media tools
        if: steps.media-cache.outputs.cache-hit != 'true' && runner.os != 'Windows'
        run: scripts/release/media-toolchain/build.sh .release/sources .release/media

      - name: Build Windows release media tools
        if: steps.media-cache.outputs.cache-hit != 'true' && runner.os == 'Windows'
        shell: msys2 {0}
        run: scripts/release/media-toolchain/build.sh .release/sources .release/media

      - name: Build public package modules
        run: |
          pnpm --filter @onmark/runtime build
          pnpm --filter @onmark/authoring build
          pnpm --filter @onmark/motion-gsap build
          pnpm --filter @onmark/bundler build
          pnpm --filter @onmark/launcher build

      - name: Build native release tools
        env:
          CARGO_TARGET_DIR: .release/cargo-target
        run: cargo build --locked --release -p onmark-cli -p onmark-xtask

      - name: Verify product version
        if: matrix.target == 'linux-x64'
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.source.outputs.version }}
        run: |
          if [[ -n "$RELEASE_VERSION" ]]; then
            "${{ matrix.release-driver }}" release verify "$RELEASE_VERSION"
          else
            "${{ matrix.release-driver }}" release verify
          fi

      - name: Assemble release packages
        shell: bash
        run: |
          "${{ matrix.release-driver }}" release sidecar \
            --target "${{ matrix.target }}" \
            --onmark "${{ matrix.native-cli }}" \
            --media .release/media \
            --source-revision "$SOURCE_REVISION" \
            --output .release/sidecar
          node scripts/release/npm/assemble-package.mjs \
            --source-revision "$SOURCE_REVISION" \
            --output .release/product

      - name: Admit installed product
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == Windows ]]; then
            npm_root="$(node -p 'require("node:path").join(require("node:path").dirname(process.execPath), "node_modules")')"
          else
            npm_root="$(npm root --global)"
          fi
          npm_cli="$(node -e 'process.stdout.write(require("node:path").join(process.argv[1], "npm/bin/npm-cli.js"))' "$npm_root")"
          test -f "$npm_cli"
          node scripts/release/npm/admit.mjs \
            "$npm_cli" \
            .release/product \
            .release/sidecar \
            .release/performance.json
          test -s .release/performance.json

      - name: Pack admitted artifacts
        shell: bash
        run: |
          mkdir -p .release/artifacts
          npm pack .release/sidecar --pack-destination .release/artifacts --silent
          if [[ "${{ matrix.target }}" == linux-x64 ]]; then
            npm pack .release/product --pack-destination .release/artifacts --silent
          fi
          cp \
            .release/performance.json \
            ".release/artifacts/performance-${{ matrix.target }}.json"

      - name: Retain admitted artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-${{ matrix.target }}
          path: .release/artifacts/*
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7

      - name: Save release media tools
        if: steps.media-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: .release/media
          key: desktop-media-${{ matrix.target }}-${{ hashFiles('scripts/release/media-toolchain/*') }}

      - name: Save release Cargo artifacts
        if: steps.cargo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            .release/cargo-target
          key: desktop-cargo-${{ matrix.target }}-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('Cargo.lock') }}

  publish:
    name: Publish npm release
    if: needs.source.outputs.version != ''
    needs: [source, admit]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: npm-release
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Check out released source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.source.outputs.revision }}

      - name: Install pinned Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 26.4.0
          package-manager-cache: false
          registry-url: https://registry.npmjs.org

      - name: Download admitted packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: desktop-*
          path: .release/publication
          merge-multiple: true

      - name: Publish admitted packages
        shell: bash
        env:
          RELEASE_TAG: v${{ needs.source.outputs.version }}
        run: |
          unset NODE_AUTH_TOKEN
          npm_root="$(npm root --global)"
          npm_cli="$(node -e 'process.stdout.write(require("node:path").join(process.argv[1], "npm/bin/npm-cli.js"))' "$npm_root")"
          test -f "$npm_cli"
          node scripts/release/npm/publish.mjs \
            --npm-cli "$npm_cli" \
            --tag "$RELEASE_TAG" \
            --directory .release/publication \
            --mode publish

      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: v${{ needs.source.outputs.version }}
        run: |
          revision="$(git rev-parse HEAD)"
          remote_tag="$(git ls-remote --tags origin "refs/tags/$RELEASE_TAG")"
          release_args=(--title "$RELEASE_TAG" --generate-notes)

          if [[ -n "$remote_tag" ]]; then
            git fetch --no-tags origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
            if [[ "$(git rev-list -n 1 "$RELEASE_TAG")" != "$revision" ]]; then
              echo "$RELEASE_TAG does not identify the admitted revision" >&2
              exit 1
            fi
            release_args+=(--verify-tag)
          else
            release_args+=(--target "$revision")
          fi

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "$RELEASE_TAG already has a GitHub release"
          else
            gh release create "$RELEASE_TAG" "${release_args[@]}"
          fi
