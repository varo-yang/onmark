<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body,
      om-film,
      om-scene,
      om-shot {
        display: block;
        height: 100%;
        margin: 0;
        overflow: hidden;
        width: 100%;
      }

      body {
        background: #08090c;
        color: #f5f1e8;
        font-family: "Helvetica Neue", "Segoe UI", sans-serif;
      }

      om-shot {
        background:
          radial-gradient(
            circle at 82% 22%,
            rgb(125 255 178 / 28%),
            transparent 34%
          ),
          linear-gradient(145deg, #11131a, #060709);
        inset: 0;
        position: fixed;
      }

      om-transition {
        background: #7dffb2;
        display: block;
        inset: 0;
        position: fixed;
        transform: scaleX(0);
        z-index: 4;
      }

      om-title {
        display: block;
        font-size: 160px;
        font-weight: 650;
        left: 8vw;
        letter-spacing: -0.08em;
        line-height: 0.82;
        position: fixed;
        top: 50%;
        transform: translateY(-50%);
      }
    </style>
  </head>
  <body>
    <om-film>
      <om-scene>
        <om-shot duration="1s">
          <om-title>Exact one.</om-title>
        </om-shot>
        <om-transition duration="500ms"></om-transition>
        <om-shot duration="1s">
          <om-title>Exact two.</om-title>
        </om-shot>
        <om-transition duration="500ms"></om-transition>
        <om-shot duration="1s">
          <om-title>Exact three.</om-title>
        </om-shot>
        <om-transition duration="500ms"></om-transition>
        <om-shot duration="1s">
          <om-title>Exact four.</om-title>
        </om-shot>
      </om-scene>

      <script type="module" data-om-motion>
        import { gsapMotion } from "onmark/motion/gsap";

        export const motion = gsapMotion({
          title({ element, timeline }) {
            timeline.from(element, {
              duration: 0.7,
              ease: "power4.out",
              opacity: 0,
              y: 48,
            });
          },
          transition({ element, incomingElement, outgoingElement, timeline }) {
            timeline
              .set(incomingElement, { zIndex: 2 }, 0)
              .set(outgoingElement, { zIndex: 1 }, 0)
              .fromTo(
                incomingElement,
                { clipPath: "inset(0 100% 0 0)" },
                {
                  clipPath: "inset(0 0% 0 0)",
                  duration: 0.5,
                  ease: "power3.inOut",
                },
                0,
              )
              .fromTo(
                element,
                { scaleX: 0, transformOrigin: "left center" },
                {
                  duration: 0.5,
                  ease: "power3.inOut",
                  scaleX: 1,
                },
                0,
              );
          },
        });
      </script>
    </om-film>
  </body>
</html>
